    function getFirestoreDb(cfg) {
      if (!cfg || !cfg.useFirebase || !cfg.firebaseConfig || !cfg.firebaseConfig.apiKey || !cfg.firebaseConfig.projectId || !window.firebase) {
        return null;
      }
      try {
        const appName = 'gratitude_' + cfg.firebaseConfig.projectId;
        let app = firebase.apps && firebase.apps.find(a => a.name === appName);
        if (!app) {
          app = firebase.initializeApp(cfg.firebaseConfig, appName);
        }
        return app.firestore();
      } catch (e) {
        console.warn('Firebase init error:', e);
        return null;
      }
    }

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatKoreanDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${parseInt(parts[0], 10)}년 ${parseInt(parts[1], 10)}월 ${parseInt(parts[2], 10)}일`;
    }

    function getCalendarGrid(year, month) {
      const firstDayIndex = new Date(year, month - 1, 1).getDay();
      const totalDays = new Date(year, month, 0).getDate();
      const days = [];

      const prevMonthTotalDays = new Date(year, month - 1, 0).getDate();
      for (let i = firstDayIndex - 1; i >= 0; i--) {
        const prevDay = prevMonthTotalDays - i;
        const prevMonth = month === 1 ? 12 : month - 1;
        const prevYear = month === 1 ? year - 1 : year;
        days.push({
          day: prevDay,
          dateStr: `${prevYear}-${String(prevMonth).padStart(2, '0')}-${String(prevDay).padStart(2, '0')}`,
          isCurrentMonth: false
        });
      }

      for (let i = 1; i <= totalDays; i++) {
        days.push({
          day: i,
          dateStr: `${year}-${String(month).padStart(2, '0')}-${String(i).padStart(2, '0')}`,
          isCurrentMonth: true
        });
      }

      const remaining = (7 - (days.length % 7)) % 7;
      for (let i = 1; i <= remaining; i++) {
        const nextMonth = month === 12 ? 1 : month + 1;
        const nextYear = month === 12 ? year + 1 : year;
        days.push({
          day: i,
          dateStr: `${nextYear}-${String(nextMonth).padStart(2, '0')}-${String(i).padStart(2, '0')}`,
          isCurrentMonth: false
        });
      }
      return days;
    }

    // AI & Keywords
    function extractKeywords(text) {
      const categories = [
        { name: '친구', keywords: ['친구', '짝꿍', '같이', '놀았', '이야기', '도와줬', '함께'] },
        { name: '가족', keywords: ['엄마', '아빠', '부모님', '동생', '형', '누나', '가족', '집'] },
        { name: '선생님', keywords: ['선생님', '칭찬', '가르쳐', '수업', '말씀'] },
        { name: '학교·일상', keywords: ['학교', '교실', '급식', '점심', '체육', '음악', '운동장', '하늘'] },
        { name: '배움·성장', keywords: ['공부', '새로운', '배웠', '알게', '시험', '문제', '숙제', '책', '해냈'] },
        { name: '나 자신', keywords: ['스스로', '나', '참았', '끝까지', '노력', '운동', '뿌듯'] }
      ];
      const matched = [];
      for (const cat of categories) {
        if (cat.keywords.some(k => text.includes(k))) {
          matched.push(cat.name);
        }
      }
      return matched.length > 0 ? matched.slice(0, 3) : ['일상·감사'];
    }

    function generateAIComment(g1, g2, g3) {
      const fullText = `${g1} ${g2} ${g3}`;
      const keywords = extractKeywords(fullText);

      // Crisis / distress safety detector
      const distress = ['죽고 싶', '살기 싫', '괴롭힘', '따돌림', '때렸', '자해'];
      if (distress.some(d => fullText.includes(d))) {
        return {
          comment: "오늘 마음이 많이 힘들고 무거운 일이 있었던 것 같아요. 혼자 힘들어하지 말고 믿을 수 있는 선생님이나 어른에게 편하게 이야기해 보세요. 당신의 마음을 언제나 응원해요. 🌱",
          keywords: ['마음돌봄']
        };
      }

      if (keywords.includes('친구')) {
        return {
          comment: "함께해 준 친구의 마음을 소중하게 생각하고 있네요. 서로 도와주는 따뜻한 우정이 느껴져요! 💚",
          keywords
        };
      }
      if (keywords.includes('선생님')) {
        return {
          comment: "선생님의 말씀과 칭찬 속에서 긍정적인 힘을 얻었군요. 오늘의 뿌듯한 마음을 소중히 간직해 보세요! 💜",
          keywords
        };
      }
      if (keywords.includes('가족')) {
        return {
          comment: "가족과 함께 나눈 따뜻한 온기가 글 속에 가득 담겨 있네요. 소중한 사람들과의 시간이 큰 힘이 되었을 거예요. 💙",
          keywords
        };
      }
      if (keywords.includes('배움·성장')) {
        return {
          comment: "새로운 것을 배우고 스스로 해내는 과정에서 큰 보람을 찾았군요. 한 걸음씩 성장해가는 모습이 정말 멋집니다! 🧡",
          keywords
        };
      }
      if (keywords.includes('나 자신')) {
        return {
          comment: "스스로 노력하고 잘 견뎌낸 자신을 따뜻하게 격려해 준 하루였네요. 오늘 하루도 수고 많았어요! 🌱",
          keywords
        };
      }

      return {
        comment: "오늘 하루 속에서 작은 감사들을 세심하게 발견해 낸 모습이 참 좋아요. 내일도 주변의 좋은 순간을 찾아보세요! 🌱",
        keywords
      };
    }

    // --- 학생 입력 맞춤형 감사 문장 동적 제안 생성기 ---
    function generateSentenceSuggestion(input) {
      const clean = (input || '').trim().replace(/[.!?~^♡♥★☆\s]+$/g, '');
      if (!clean) return '예: 오늘 점심 급식에 내가 좋아하는 음식이 나와 맛있게 먹었어요.';

      const NOUNS = [
        '게임', '그림', '모임', '모둠', '피자', '과자', '의자', '상자', '모자', '감자',
        '바다', '사이다', '소다', '판다', '바나나', '피아노'
      ];

      // 1. 끝이 연결어미로 끝난 경우 (예: ~고, ~서, ~며, ~면, ~다가)
      if (!NOUNS.some(n => clean.endsWith(n)) && /[고며면서니게]$|[^피과모상의감]자$/.test(clean)) {
        return `예: '${clean} 정말 기분 좋고 감사한 마음이 들었어요.'`;
      }

      // 2. 끝이 조사로 끝난 경우 (예: ~을/를, ~와/과, ~에, ~으로, ~도)
      if (/[을를]$/.test(clean)) {
        if (/밥|급식|음식|반찬|간식|사과|빵|고기|라면|돈가스|피자|과자|치킨|떡볶이/.test(clean)) {
          return `예: '${clean} 맛있게 먹고 든든하게 하루를 보낼 수 있어서 감사했어요.'`;
        }
        if (/체육|피구|축구|수업|공부|숙제|시험|게임|놀이|책|독서|활동/.test(clean)) {
          return `예: '${clean} 열심히 참여하며 보람찬 시간을 보냈어요.'`;
        }
        return `예: '${clean} 소중하게 생각하며 감사한 하루를 보냈어요.'`;
      }
      if (/[와과랑]$/.test(clean)) {
        return `예: '${clean} 함께 즐거운 시간을 보내고 서로 도와주어서 고마웠어요.'`;
      }
      if (/[에서]$/.test(clean)) {
        return `예: '${clean} 새로운 것을 배우고 즐겁게 활동해서 감사했어요.'`;
      }
      if (/[에게한테께]$/.test(clean)) {
        return `예: '${clean} 고마운 마음을 전할 수 있어서 뜻깊었어요.'`;
      }
      if (/[이가은는]$/.test(clean)) {
        return `예: '${clean} 나를 따뜻하게 격려해 주셔서 큰 힘이 되었어요.'`;
      }
      if (/[에로도만]$/.test(clean)) {
        return `예: '${clean} 좋은 일이 생겨서 정말 감사하고 다행이었어요.'`;
      }

      // 3. 끝 단어별 맞춤 제안 (명사 종결)
      if (/선물$/.test(clean)) {
        return `예: '${clean}을(를) 받아 정말 기쁘고 감사한 마음이 들었어요.'`;
      }
      if (/밥|급식|음식|반찬|간식|사과|빵|고기|라면|돈가스|피자|과자|치킨|떡볶이|국|찌개|과일|우유|아침|점심|저녁/.test(clean)) {
        return `예: '${clean}을(를) 맛있게 먹고 힘차게 하루를 보낼 수 있어서 감사했어요.'`;
      }
      if (/친구|선생님|엄마|아빠|부모님|동생|형|누나|오빠|가족|짝꿍|할머니|할아버지/.test(clean)) {
        return `예: '${clean}와(과) 함께 사이좋게 지내고 힘이 되어주어서 감사했어요.'`;
      }
      if (/체육|피구|축구|수업|공부|숙제|시험|게임|놀이|책|독서|도서관|음악|미술|운동|달리기/.test(clean)) {
        return `예: '${clean} 활동에 즐겁게 참여하고 끝까지 해내서 스스로 뿌듯했어요.'`;
      }
      if (/날씨|하늘|바람|햇살|햇빛|비|눈|공기/.test(clean)) {
        return `예: '오늘 상쾌한 ${clean} 덕분에 기분 좋은 하루를 보냈어요.'`;
      }

      return `예: '${clean} 덕분에 오늘 하루도 즐겁고 감사한 순간이 되었어요.'`;
    }

    const NOUNS_ENDING_IN_TERMINATIONS = [
      '게임', '그림', '모임', '모둠', '피자', '과자', '의자', '상자', '모자', '감자',
      '바다', '사이다', '소다', '판다', '바나나', '피아노'
    ];

    // --- 감사일기 문장 완성도 및 문맥적 의미 정밀 검사 ---
    function checkGratitudeQuality(text) {
      const trimmed = (text || '').trim();
      if (!trimmed) {
        return {
          valid: false,
          reason: 'empty',
          message: '내용을 작성해 주세요.',
          summaryBadge: '💡 단어가 아닌 완성된 문장으로 적어보세요'
        };
      }

      const withoutSpaces = trimmed.replace(/\s/g, '');
      const cleanText = trimmed.replace(/[.!?~^♡♥★☆\s]+$/g, '');
      const lastChar = cleanText.slice(-1);

      // 1. 자음 또는 모음만 입력 (예: ㅇ, ㅋㅋㅋ, ㅎㅎ, ㄱㄱ, ㅏㅏ)
      const isOnlyJamo = /^[ㄱ-ㅎㅏ-ㅣ\s\.\,\!\?\~\^\-]+$/.test(trimmed);
      if (isOnlyJamo) {
        return {
          valid: false,
          reason: 'jamo',
          message: '자음이나 모음(예: ㅇ, ㅋㅋ)만으로는 감사한 마음을 알기 어려워요. 어떤 일이 고마웠는지 온전한 문장으로 적어볼까요? 😊',
          suggestion: '예: 짝꿍이 모르는 문제를 친절하게 가르쳐 주었어요.',
          summaryBadge: '🌱 자음 대신 문장으로 적어보세요'
        };
      }

      // 2. 특수문자, 기호, 숫자만 입력
      const isOnlySymbols = /^[\d\s\.\,\!\?\~\@\#\$\%\^\&\*\(\)\_\+\-\=\[\]\{\}\;\:\'\"\\\/\<\>]+$/.test(trimmed);
      if (isOnlySymbols) {
        return {
          valid: false,
          reason: 'symbols',
          message: '기호나 숫자 대신 오늘 감사했던 순간을 글로 표현해 보세요! ✏️',
          suggestion: '예: 점심 급식에 내가 좋아하는 돈가스가 나와 맛있게 먹었어요.',
          summaryBadge: '🌱 기호 대신 문장으로 표현해 보세요'
        };
      }

      // 3. 같은 문자 연속 도배 (예: aaaaa, 가가가가, 1111, 하하하하)
      const isRepeatedChar = /^(.)\1{2,}$/.test(withoutSpaces) || /^(.{2})\1+$/.test(withoutSpaces);
      if (isRepeatedChar) {
        return {
          valid: false,
          reason: 'repeated',
          message: '같은 글자를 반복하기보다 오늘 있었던 특별한 기억을 천천히 떠올려 보세요! 🌸',
          suggestion: '예: 체육 시간에 친구들과 피구를 함께해서 즐거웠어요.',
          summaryBadge: '🌱 반복 글자 대신 오늘 일을 적어보세요'
        };
      }

      // 4. 무의미한 자판 나열 및 테스트성 문구
      const dummyPatterns = [
        '가나다', '가나다라', '동해물과', '아자차카', '하늘땅',
        '테스트', '아무거나', '아무말', '쓸게없', '할말없', '그냥적', '그냥씀',
        '대충적', '대충씀', '모르겠', '기억안', '기억이안', '없다고', '없다니',
        '패스합', 'qwer', 'asdf', 'zxcv', 'ㅁㄴㅇㄹ', 'ㅂㅈㄷㄱ'
      ];
      if (dummyPatterns.some(p => withoutSpaces.includes(p))) {
        return {
          valid: false,
          reason: 'dummy',
          message: '임의의 글자나 테스트 문구 대신 오늘 실제로 있었던 감사한 일을 진심을 담아 적어보세요! 💡',
          suggestion: '예: 숙제를 포기하지 않고 끝까지 해내서 스스로 뿌듯했어요.',
          summaryBadge: '🌱 진심을 담은 감사 문장을 적어보세요'
        };
      }

      // 5. 무성의/회피성 단어 (없음, 몰라, 그냥, 귀찮아, pass 등)
      const dismissiveWords = [
        '없음', '없다', '없어요', '모름', '몰라', '몰라요',
        '그냥', '귀찮', '귀찮음', '귀찮아', '패스', 'pass',
        'none', 'nothing', '싫어', '알아서뭐함', '없는데', 'ㄴㄴ', 'ㅇㅇ', '싫음', '별로'
      ];
      const cleanWord = withoutSpaces.toLowerCase();
      if (dismissiveWords.some(w => cleanWord === w || (cleanWord.length <= 5 && cleanWord.includes(w)))) {
        return {
          valid: false,
          reason: 'dismissive',
          message: '거창한 일이 아니어도 괜찮아요. 오늘 마신 시원한 물 한 잔, 친구와의 인사처럼 소소하고 작은 일상도 훌륭한 감사가 된답니다! 🌿',
          suggestion: '예: 오늘 아침 맑은 하늘을 보며 상쾌한 기분이 들었어요.',
          summaryBadge: '🌱 소소한 일상도 좋은 감사가 돼요'
        };
      }

      // 6. 조사로 끝난 문장 (문장이 조사에서 끊김)
      const particleEndings = ['을', '를', '이', '가', '은', '는', '에', '의', '와', '과', '랑', '로', '으로', '도', '만', '서', '에서', '에게', '한테', '보다', '처럼', '까지', '부터', '조차', '마저', '께'];
      if (particleEndings.some(p => cleanText.endsWith(p))) {
        return {
          valid: false,
          reason: 'incomplete_ending',
          message: `문장이 조사('~${lastChar}')에서 멈추었어요. 뒤이어 어떤 일이 일어났거나 어떤 기분이 들었는지 문장 끝까지 완성해 볼까요? 💭`,
          suggestion: generateSentenceSuggestion(cleanText),
          summaryBadge: '🌱 문장이 중간에 끊겼어요'
        };
      }

      // 7. 연결어미/접속형으로 끝난 문장 (마무리 서술 부재)
      const conjunctiveEndings = ['고', '며', '면', '으면', '아서', '어서', '해서', '여서', '니까', '으니까', '려고', '으려고', '다가', '자마자', '는데', '은데', '텐데', '지만', '으나', '도록', '게'];
      if (conjunctiveEndings.some(c => cleanText.endsWith(c))) {
        return {
          valid: false,
          reason: 'incomplete_ending',
          message: '문장이 이어지다 멈춘 것 같아요. 그래서 어떤 마음이 들었는지 마무리를 지어보세요! 🌿',
          suggestion: generateSentenceSuggestion(cleanText),
          summaryBadge: '🌱 문장 마무리를 완성해 보세요'
        };
      }

      // 8. 문장이 아닌 경우 (단어/명사구 종결 검사 - '오늘 아침 밥', '체육 시간 피구', '점심 급식 돈가스' 등)
      const VALID_SENTENCE_ENDINGS = new Set([
        '다', '요', '음', '슴', '함', '어', '아', '해', '네', '군', '죠', '지', '심', '나', '자', '길'
      ]);
      const isEndingInNoun = NOUNS_ENDING_IN_TERMINATIONS.some(noun => cleanText.endsWith(noun));
      const hasValidTermination = VALID_SENTENCE_ENDINGS.has(lastChar) && !isEndingInNoun;

      if (!hasValidTermination) {
        return {
          valid: false,
          reason: 'not_a_sentence',
          message: `'${trimmed}'처럼 단어나 명사만 적기보다, 어떤 일이 있었고 어떤 마음이 들었는지 완성된 문장(~했어요, ~했습니다)으로 적어볼까요? ✏️`,
          suggestion: generateSentenceSuggestion(cleanText),
          summaryBadge: '🌱 단어 대신 완성된 문장으로 적어보세요'
        };
      }

      // 9. 최소 글자수 체크 (공백 제외 6글자 미만)
      if (withoutSpaces.length < 6) {
        return {
          valid: false,
          reason: 'too_short',
          message: `'${trimmed}'을(를) 조금만 더 구체적인 완성 문장으로 적어볼까요? (최소 6글자 이상 문장) 🌱`,
          suggestion: generateSentenceSuggestion(cleanText),
          summaryBadge: '🌱 문장으로 조금만 더 적어보세요'
        };
      }

      // 10. 종결어미가 붙어있으나 서술어 및 감정/행동 표현이 온전한지 검사
      const predicatesAndSentiments = [
        '다', '요', '음', '임', '어', '네', '군', '지', '죠', '함', '됨', '봄', '줌',
        '맛있', '좋았', '좋아', '고맙', '고마', '감사', '뿌듯', '신났', '신나', '재미',
        '즐거', '행복', '보람', '편안', '따뜻', '예뻤', '멋졌', '해냈', '배웠', '도와',
        '도움', '먹었', '마셨', '놀았', '웃었', '칭찬', '격려', '응원', '이겼', '쉬었',
        '만났', '풀었', '받았', '줬다', '주셨', '나눴', '성공', '다행', '든든', '흐뭇',
        '했', '됐', '봤', '왔', '갔', '나누', '함께'
      ];
      const hasValidPredicate = predicatesAndSentiments.some(p => withoutSpaces.includes(p));
      if (!hasValidPredicate) {
        return {
          valid: false,
          reason: 'no_predicate',
          message: '단어 나열 대신 어떤 일이 있었는지 구체적인 행동이나 느낌을 담아 문장을 완성해 보세요! 💭',
          suggestion: generateSentenceSuggestion(cleanText),
          summaryBadge: '🌱 상황이나 느낌을 문장으로 적어보세요'
        };
      }

      return {
        valid: true,
        message: '따뜻하고 정성스러운 감사 문장이에요!',
        summaryBadge: '✓ 따뜻하고 정성스러운 감사 문장이에요!'
      };
    }

    function validateAllGratitudes(g1, g2, g3) {
      const q1 = checkGratitudeQuality(g1);
      if (!q1.valid) {
        const title = q1.reason === 'not_a_sentence'
          ? '첫 번째 감사를 완성된 문장으로 적어볼까요? ✏️'
          : '첫 번째 감사 질문을 다시 한번 생각해 볼까요? 💭';
        return {
          field: 1,
          title,
          message: q1.message,
          suggestion: q1.suggestion || generateSentenceSuggestion(g1)
        };
      }

      const q2 = checkGratitudeQuality(g2);
      if (!q2.valid) {
        const title = q2.reason === 'not_a_sentence'
          ? '두 번째 감사를 완성된 문장으로 적어볼까요? ✏️'
          : '두 번째 감사 질문을 다시 한번 생각해 볼까요? 💭';
        return {
          field: 2,
          title,
          message: q2.message,
          suggestion: q2.suggestion || generateSentenceSuggestion(g2)
        };
      }

      const q3 = checkGratitudeQuality(g3);
      if (!q3.valid) {
        const title = q3.reason === 'not_a_sentence'
          ? '세 번째 감사를 완성된 문장으로 적어볼까요? ✏️'
          : '세 번째 감사 질문을 다시 한번 생각해 볼까요? 💭';
        return {
          field: 3,
          title,
          message: q3.message,
          suggestion: q3.suggestion || generateSentenceSuggestion(g3)
        };
      }

      // 3가지 내용 중복 검사
      const t1 = (g1 || '').trim().replace(/\s/g, '');
      const t2 = (g2 || '').trim().replace(/\s/g, '');
      const t3 = (g3 || '').trim().replace(/\s/g, '');

      if (t1 === t2 || t2 === t3 || t1 === t3) {
        return {
          field: (t1 === t2) ? 2 : 3,
          title: '서로 다른 3가지 감사를 찾아볼까요? ✨',
          message: '각 질문마다 서로 다른 감사한 순간을 하나씩 적어주세요. 친구, 가족, 선생님, 학교생활 등 다양한 고마움을 떠올려 보세요!',
          suggestion: '예: 1번은 친구 이야기, 2번은 맛있는 음식이나 가족 이야기, 3번은 스스로 칭찬해줄 일'
        };
      }

      return null;
    }

    // --- 4. Main React Component ---
    function App() {
      // Initialize local storage
      useEffect(() => {

        return raw ? JSON.parse(raw) : [];
      });

        return raw ? JSON.parse(raw) : { year: 2026, grade: 1, classNum: 1, totalStudents: 24, teacherPin: '1234' };
      });

      // Firebase states in App
      const [firebaseSnippetInput, setFirebaseSnippetInput] = useState('');
      const [copiedLink, setCopiedLink] = useState(false);
      const [copiedRules, setCopiedRules] = useState(false);

      // Firebase Cloud Sync on mount / config change
      useEffect(() => {
        const db = getFirestoreDb(config);
        if (!db) return;

        db.collection('students').get().then(snap => {
          if (!snap.empty) {
            const list = [];
            snap.forEach(d => list.push(d.data()));
            setStudents(list);
            localStorage.setItem(STORAGE_KEYS.STUDENTS, JSON.stringify(list));
          }
        }).catch(err => console.warn('Firestore load students error:', err));

        db.collection('gratitude_entries').get().then(snap => {
          if (!snap.empty) {
            const list = [];
            snap.forEach(d => list.push(d.data()));
            setEntries(list);
            localStorage.setItem(STORAGE_KEYS.ENTRIES, JSON.stringify(list));
          }
        }).catch(err => console.warn('Firestore load entries error:', err));

        db.collection('teacher_notes').get().then(snap => {
          if (!snap.empty) {
            const list = [];
            snap.forEach(d => list.push(d.data()));
            setNotes(list);
            localStorage.setItem(STORAGE_KEYS.NOTES, JSON.stringify(list));
          }
        }).catch(err => console.warn('Firestore load notes error:', err));
      }, [config]);

      // Toasts
      const [toasts, setToasts] = useState([]);

        const id = Date.now().toString();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
      };

      // Student Form States
      const [loginGrade, setLoginGrade] = useState(1);
      const [loginClassNum, setLoginClassNum] = useState(1);
      const [loginNumber, setLoginNumber] = useState(1);
      const [loginName, setLoginName] = useState('');

      // Sync student name when number/grade/class changes
      useEffect(() => {
        const matched = students.find(s => s.grade === loginGrade && s.classNum === loginClassNum && s.number === loginNumber);
        if (matched) setLoginName(matched.name);
        else setLoginName('');
      }, [loginGrade, loginClassNum, loginNumber, students]);

      // Calendar & Modals
      const [currentYear, setCurrentYear] = useState(() => new Date().getFullYear());
      const [currentMonth, setCurrentMonth] = useState(() => new Date().getMonth() + 1);
      const [selectedDate, setSelectedDate] = useState(() => getTodayString());

      const [diaryG2, setDiaryG2] = useState('');

      return (

                      type="button"
                      onClick={() => setIsTeacherLoginOpen(false)}
                      className="flex-1 py-2.5 rounded-xl border border-stone-200 text-xs font-semibold text-stone-600 hover:bg-stone-50"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-sage-600 hover:bg-sage-700 text-white text-xs font-bold shadow-soft"
                    >
                      입장하기
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Export Modal */}
          {isExportOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/40 backdrop-blur-sm animate-fade-in">
              <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-card border border-stone-100 animate-scale-in space-y-4">
                <h3 className="text-lg font-bold text-stone-900 flex items-center gap-2">
                  <Icon.Download className="w-5 h-5 text-emerald-600" />
                  <span>감사일기 엑셀 다운로드</span>
                </h3>
                <p className="text-xs text-stone-500">
                  {teacherGrade}학년 {teacherClassNum}반 ({teacherSelectedDate}) 데이터를 엑셀(`.xlsx`) 파일로 다운로드합니다.
                </p>
                <div className="flex justify-end gap-2 pt-2 border-t border-stone-100">
                  <button onClick={() => setIsExportOpen(false)} className="px-4 py-2 rounded-xl border border-stone-200 text-xs text-stone-600">
                    취소
                  </button>
                  <button onClick={handleExportExcel} className="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold shadow-soft">
                    다운로드 실행
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Teacher Settings Modal */}
          {isSettingsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/40 backdrop-blur-sm animate-fade-in">
              <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-card border border-stone-100 animate-scale-in space-y-4">
                <h3 className="text-lg font-bold text-stone-900 flex items-center gap-2">
                  <Icon.Settings className="w-5 h-5 text-stone-700" />
                  <span>학급 설정 & 관리</span>
                </h3>
                <div className="space-y-4 text-xs max-h-[70vh] overflow-y-auto pr-1">
                  <div>
                    <label className="block text-stone-600 font-bold mb-1">교사 비밀번호 (PIN)</label>
                    <input
                      type="text"
                      value={config.teacherPin || '1234'}
                      onChange={(e) => setConfig({ ...config, teacherPin: e.target.value })}
                      className="w-full bg-cream-50 border border-stone-200 rounded-xl px-3 py-2 font-bold text-stone-800"
                    />
                  </div>

                  {/* Firebase Section */}
                  <div className="p-3.5 bg-amber-50/70 border border-amber-200 rounded-2xl space-y-3">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-1.5 font-bold text-amber-900 text-xs">
                        <span>🔥</span>
                        <span>Firebase 배포 & 클라우드 연동</span>
                      </div>
                      <label className="flex items-center gap-1.5 cursor-pointer text-[11px] font-semibold text-amber-800">
                        <input
                          type="checkbox"
                          checked={config.useFirebase || false}
                          onChange={(e) => setConfig({ ...config, useFirebase: e.target.checked })}
                          className="w-3.5 h-3.5 text-amber-600 rounded"
                        />
                        <span>사용</span>
                      </label>
                    </div>

                    {/* Student Live Link */}
                    <div className="p-2.5 bg-white rounded-xl border border-amber-200/80 space-y-1.5">
                      <div className="text-[11px] font-bold text-stone-700 flex items-center justify-between">
                        <span>🌐 학생 배포용 웹 접속 링크</span>
                        <span className="text-[10px] text-amber-700 font-normal">
                          {config.firebaseConfig?.projectId ? '연결됨' : 'ID 설정 필요'}
                        </span>
                      </div>
                      <div className="flex items-center gap-1.5">
                        {(() => {
                          const currentLiveUrl = window.location.origin.includes('github.io')
                            ? window.location.href.split('?')[0].split('#')[0]
                            : (config.firebaseConfig?.projectId ? `https://${config.firebaseConfig.projectId}.web.app` : window.location.href.split('?')[0].split('#')[0]);
                          return (
                            <>
                              <div className="flex-1 bg-amber-50/50 border border-amber-200/60 rounded-lg px-2.5 py-1.5 text-[11px] font-mono text-stone-800 select-all overflow-x-auto whitespace-nowrap">
                                {currentLiveUrl}
                              </div>
                              <button
                                type="button"
                                onClick={() => {
                                  navigator.clipboard.writeText(currentLiveUrl);
                                  setCopiedLink(true);
                                  setTimeout(() => setCopiedLink(false), 2000);
                                  showToast('학생 배포 링크가 복사되었습니다! 📋', 'success');
                                }}
                                className="px-2.5 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-[11px] font-bold shrink-0 cursor-pointer"
                              >
                                {copiedLink ? '복사됨!' : '링크 복사'}
                              </button>
                            </>
                          );
                        })()}
                      </div>
                      <p className="text-[10px] text-amber-800">
                        * 이 링크를 학생들에게 알림장이나 메신저로 공유하면 언제 어디서나 접속할 수 있습니다.
                      </p>
                    </div>

                    {config.useFirebase && (
                      <div className="space-y-2.5 pt-1">
                        {/* Snippet Paste */}
                        <div className="space-y-1">
                          <div className="flex items-center justify-between">
                            <span className="text-[11px] font-bold text-stone-700">Firebase 콘솔 설정 코드 붙여넣기</span>
                            <button
                              type="button"
                              onClick={() => {
                                try {
                                  const text = firebaseSnippetInput;
                                  const apiKeyM = text.match(/apiKey:\s*["']([^"']+)["']/);
                                  const authDomainM = text.match(/authDomain:\s*["']([^"']+)["']/);
                                  const projectIdM = text.match(/projectId:\s*["']([^"']+)["']/);
                                  const appIdM = text.match(/appId:\s*["']([^"']+)["']/);

                                  let cfg = { ...(config.firebaseConfig || {}) };
                                  if (apiKeyM) cfg.apiKey = apiKeyM[1];
                                  if (authDomainM) cfg.authDomain = authDomainM[1];
                                  if (projectIdM) cfg.projectId = projectIdM[1];
                                  if (appIdM) cfg.appId = appIdM[1];

                                  if (apiKeyM || projectIdM) {
                                    setConfig({ ...config, useFirebase: true, firebaseConfig: cfg });
                                    showToast('Firebase 설정이 자동 파싱되어 적용되었습니다! 🌱', 'success');
                                  } else {
                                    const parsed = JSON.parse(text);
                                    setConfig({ ...config, useFirebase: true, firebaseConfig: parsed });
                                    showToast('Firebase JSON 설정이 적용되었습니다! 🌱', 'success');
                                  }
                                } catch {
                                  showToast('설정 코드를 파싱할 수 없습니다. 직접 입력란을 사용해 주세요.', 'warning');
                                }
                              }}
                              className="px-2 py-0.5 bg-amber-600 hover:bg-amber-700 text-white rounded text-[10px] font-bold"
                            >
                              자동 파싱
                            </button>
                          </div>
                          <textarea
                            rows={2}
                            value={firebaseSnippetInput}
                            onChange={(e) => setFirebaseSnippetInput(e.target.value)}
                            placeholder="Firebase 콘솔에서 복사한 firebaseConfig 코드를 여기에 붙여넣으세요."
                            className="w-full bg-white border border-stone-200 rounded-lg p-2 text-[10px] font-mono"
                          />
                        </div>

                        {/* Individual Fields */}
                        <div className="grid grid-cols-2 gap-2">
                          <div>
                            <label className="block text-[10px] font-semibold text-stone-600">Project ID</label>
                            <input
                              type="text"
                              value={config.firebaseConfig?.projectId || ''}
                              onChange={(e) => setConfig({
                                ...config,
                                firebaseConfig: { ...(config.firebaseConfig || {}), projectId: e.target.value.trim() }
                              })}
                              placeholder="my-gratitude-school"
                              className="w-full bg-white border border-stone-200 rounded-lg px-2 py-1 text-[11px] font-mono"
                            />
                          </div>
                          <div>
                            <label className="block text-[10px] font-semibold text-stone-600">API Key</label>
                            <input
                              type="password"
                              value={config.firebaseConfig?.apiKey || ''}
                              onChange={(e) => setConfig({
                                ...config,
                                firebaseConfig: { ...(config.firebaseConfig || {}), apiKey: e.target.value.trim() }
                              })}
                              placeholder="AIzaSy..."
                              className="w-full bg-white border border-stone-200 rounded-lg px-2 py-1 text-[11px] font-mono"
                            />
                          </div>
                        </div>

                        {/* Rules & Deploy Guide */}
                        <div className="flex items-center justify-between pt-1 border-t border-amber-200/60">
                          <span className="text-[11px] text-amber-900">Firestore 보안 규칙(Rules)</span>
                          <button
                            type="button"
                            onClick={() => {
                              const rules = "rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /{document=**} {\n      allow read, write: if true;\n    }\n  }\n}";
                              navigator.clipboard.writeText(rules);
                              setCopiedRules(true);
                              setTimeout(() => setCopiedRules(false), 2000);
                              showToast('Firestore 보안 규칙이 복사되었습니다! 📋', 'success');
                            }}
                            className="px-2 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded text-[10px] font-semibold"
                          >
                            {copiedRules ? '복사됨!' : '규칙 복사'}
                          </button>
                        </div>

                        <div className="p-2 bg-sage-50 rounded-lg border border-sage-200 text-[10px] text-sage-900 leading-relaxed">
                          🚀 <strong>원클릭 배포:</strong> 폴더 안의 <strong>`배포하기_firebase.bat`</strong>을 더블 클릭하면 최신 웹앱이 즉시 웹에 배포됩니다.
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="p-3.5 bg-rose-50 border border-rose-200 rounded-2xl flex items-center justify-between">
                    <div>
                      <div className="font-bold text-rose-900 text-xs">모든 데이터 초기화</div>
                      <div className="text-[11px] text-rose-700">저장된 모든 감사일기와 학생 명단을 비웁니다.</div>
                    </div>
                    <button
                      type="button"
                      onClick={() => {
                        if (confirm('저장된 모든 감사일기와 학생 데이터를 초기화하시겠습니까?')) {
                          localStorage.setItem(STORAGE_KEYS.ENTRIES, JSON.stringify([]));
                          localStorage.setItem(STORAGE_KEYS.NOTES, JSON.stringify([]));
                          localStorage.setItem(STORAGE_KEYS.STUDENTS, JSON.stringify([]));
                          localStorage.removeItem(STORAGE_KEYS.LAST_STUDENT);
                          setEntries([]);
                          setNotes([]);
                          setStudents([]);
                          setCurrentStudent(null);
                          showToast('모든 데이터가 깨끗하게 비워졌습니다. 🌱', 'info');
                          setIsSettingsOpen(false);
                        }
                      }}
                      className="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs transition shadow-xs"
                    >
                      전체 비우기
                    </button>
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2 border-t border-stone-100">
                  <button
                    onClick={() => {
                      localStorage.setItem(STORAGE_KEYS.CONFIG, JSON.stringify(config));
                      showToast('설정이 저장되었습니다.', 'success');
                      setIsSettingsOpen(false);
                    }}
                    className="px-4 py-2 bg-sage-600 text-white text-xs font-bold rounded-xl shadow-soft"
                  >
                    저장 및 닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Reset Confirmation Modal */}
          {isResetModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/40 backdrop-blur-xs">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-soft space-y-4 border border-stone-100 animate-scale-in">
                <div className="flex items-center justify-between pb-3 border-b border-stone-100">
                  <div className="flex items-center gap-2">
                    <span className="p-2 bg-rose-100 text-rose-700 rounded-2xl">
                      <Icon.RotateCcw className="w-5 h-5 text-rose-600" />
                    </span>
                    <div>
                      <h3 className="text-base font-bold text-stone-900">데이터 전체 리셋 및 초기화</h3>
                      <p className="text-[11px] text-stone-500">원하시는 리셋 범위를 선택해 주세요</p>
                    </div>
                  </div>
                  <button onClick={() => setIsResetModalOpen(false)} className="text-stone-400 hover:text-stone-600 p-1 rounded-lg">
                    <Icon.X className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-3.5 bg-rose-50 border border-rose-200 rounded-2xl flex items-start gap-2.5">
                  <span className="text-base">⚠️</span>
                  <p className="text-xs text-rose-900 leading-relaxed font-medium">
                    <span className="font-bold">주의:</span> 리셋 후에는 데이터를 다시 복구할 수 없습니다. 새 학기나 새로운 학급을 시작하거나, 테스트 목적으로 작성된 데이터를 비우실 때 사용하세요.
                  </p>
                </div>

                <div className="space-y-3 pt-1">
                  {/* Option 1: Complete Reset */}
                  <div className="p-4 bg-cream-50/80 border-2 border-rose-200 hover:border-rose-300 rounded-2xl transition">
                    <div className="flex items-start justify-between gap-2 mb-1.5">
                      <div className="font-bold text-sm text-stone-900 flex items-center gap-1.5">
                        <span className="text-rose-600">⚠️</span>
                        <span>모든 데이터 완전 리셋 (완전 백지화)</span>
                      </div>
                      <span className="px-2 py-0.5 text-[10px] font-bold bg-rose-100 text-rose-800 rounded-md shrink-0">전체 초기화</span>
                    </div>
                    <p className="text-xs text-stone-600 mb-3 leading-relaxed">
                      저장된 <span className="font-bold text-stone-800">학생 명단, 감사일기 전체, 교사 관찰 메모</span>를 모두 삭제하여 처음 설치한 상태처럼 깨끗하게 비웁니다.
                    </p>
                    <button
                      type="button"
                      onClick={handleResetAll}
                      className="w-full py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs transition shadow-xs flex items-center justify-center gap-1.5 cursor-pointer"
                    >
                      <Icon.RotateCcw className="w-3.5 h-3.5" />
                      <span>모든 데이터 완전 리셋 실행</span>
                    </button>
                  </div>

                  {/* Option 2: Diaries only */}
                  <div className="p-4 bg-cream-50/80 border border-amber-200 hover:border-amber-300 rounded-2xl transition">
                    <div className="flex items-start justify-between gap-2 mb-1.5">
                      <div className="font-bold text-sm text-stone-900 flex items-center gap-1.5">
                        <span className="text-amber-600">📝</span>
                        <span>감사일기 기록만 비우기 (학생 명단 유지)</span>
                      </div>
                      <span className="px-2 py-0.5 text-[10px] font-bold bg-amber-100 text-amber-800 rounded-md shrink-0">명단 보존</span>
                    </div>
                    <p className="text-xs text-stone-600 mb-3 leading-relaxed">
                      <span className="font-bold text-emerald-700">학생 명단(이름, 번호)은 안전하게 그대로 유지</span>하고, 작성된 감사일기와 교사 메모만 비워 새로 일기를 시작합니다.
                    </p>
                    <button
                      type="button"
                      onClick={handleResetDiariesOnly}
                      className="w-full py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl text-xs transition shadow-xs flex items-center justify-center gap-1.5 cursor-pointer"
                    >
                      <Icon.FileText className="w-3.5 h-3.5" />
                      <span>일기 및 메모만 비우기 실행</span>
                    </button>
                  </div>
                </div>

                <div className="flex justify-end pt-2 border-t border-stone-100">
                  <button
                    type="button"
                    onClick={() => setIsResetModalOpen(false)}
                    className="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-bold rounded-xl transition cursor-pointer"
                  >
                    닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification Container */}
          {toasts.length > 0 && (
            <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full px-3">
              {toasts.map(toast => (
                <div
                  key={toast.id}
                  className="bg-white border border-stone-200 text-stone-800 p-3.5 rounded-2xl shadow-soft flex items-center justify-between text-xs font-bold animate-scale-in"
                >
                  <div className="flex items-center gap-2">
                    <span>{toast.type === 'success' ? '🌱' : 'ℹ️'}</span>
                    <span>{toast.message}</span>
                  </div>
                  <button onClick={() => setToasts(prev => prev.filter(t => t.id !== toast.id))} className="text-stone-400 hover:text-stone-600 ml-2">
                    <Icon.X className="w-3.5 h-3.5" />
                  </button>
                </div>
              ))}
            </div>
          )}

          {/* Footer */}
          <footer className="bg-white/80 border-t border-stone-100 py-6 text-center text-xs text-stone-400">
            <div className="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <span>🌱</span>
                <span className="font-semibold text-stone-600">오늘의 감사 - 감사일기</span>
                <span>—</span>
                <span>초·중·고 학교 맞춤형 감사 습관 플랫폼</span>
              </div>
              <div className="text-stone-400">
                개인정보를 안전하게 보호하며, AI는 오직 학생을 격려하고 응원합니다.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Render to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
